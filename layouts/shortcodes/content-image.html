{{- $image := resources.Get (.Get "src") -}}
{{- with $image -}}
  {{- $maxWidth := default 700 ($.Get "max-width") -}}
  {{- $resized := .Resize (printf "%dx" $maxWidth) -}}
  <img src="{{ $resized.RelPermalink }}" alt="{{ $.Get "alt" }}" class="img-center" style="width: 100%; max-width: {{ $maxWidth }}px;" width="{{ $resized.Width }}" height="{{ $resized.Height }}" loading="lazy">
{{- else -}}
  {{- errorf "content-image shortcode could not find %q" ($.Get "src") -}}
{{- end -}}
